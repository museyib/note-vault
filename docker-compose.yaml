services:
  app:
    build: .
    ports:
      - "8090:8090"
    environment:
      DB_URL: jdbc:postgresql://db:5432/note_vault
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: note_vault
